name: Build unofficial AppImage/deb (manual)

# Não dispara automaticamente em tags/releases: são pacotes não-oficiais,
# gerados sob demanda para quem quiser testar localmente. O snap continua
# sendo o formato de distribuição oficial/suportado.
on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo, necessário para `git describe --tags`

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Resolve version from git tags
        run: |
          # Mesmo esquema já usado em snap/snapcraft.yaml: git describe --tags
          # e substituição do placeholder @@VERSION@@ no package.json.
          VERSION=$(git describe --tags --abbrev=10 2>/dev/null || echo "0.0.0-dev")
          sed -i.bak -e "s|@@VERSION@@|$VERSION|g" package.json
          echo "Building version $VERSION"

      - name: Build AppImage and deb
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duck-ai-linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 30
